# 免费节点订阅池 · 定时更新工作流
#
# 说明：
#   1. 所有 action 固定到 commit SHA（不用 v4/v5 这类可变 tag）
#   2. 显式最小权限，只给 contents: write
#   3. 加 concurrency 锁，防止定时触发与手动触发重叠互相覆盖
#   4. 内核下载加 SHA256 校验（sing-box 官方 release 不含 checksums，
#      因此采用「首次记录基线 + 后续比对」的策略）
#   5. 失败时把 output/ 打包上传，便于对照日志排查

name: Update Subscriptions

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: freesub-update
  cancel-in-progress: false

permissions:
  contents: write

env:
  SINGBOX_VERSION: v1.14.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # v4.2.2
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # v5.6.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch sing-box kernel with checksum verification
        run: |
          set -euo pipefail
          VER="${SINGBOX_VERSION#v}"
          URL="https://github.com/SagerNet/sing-box/releases/download/${SINGBOX_VERSION}/sing-box-${VER}-linux-amd64.tar.gz"
          mkdir -p runtime
          curl -fsSL --retry 3 --retry-delay 3 "$URL" -o /tmp/sb.tar.gz
          ACTUAL="$(sha256sum /tmp/sb.tar.gz | cut -d' ' -f1)"
          echo "内核 SHA256: ${ACTUAL}"
          BASELINE="scripts/kernel.sha256"
          if [ -f "$BASELINE" ]; then
            EXPECT="$(tr -d '[:space:]' < "$BASELINE")"
            if [ "$ACTUAL" != "$EXPECT" ]; then
              echo "::error::内核哈希不匹配。期望 ${EXPECT}，实际 ${ACTUAL}。已中止。"
              exit 1
            fi
            echo "::notice::内核哈希校验通过"
          else
            echo "$ACTUAL" > "$BASELINE"
            echo "::warning::未找到基线，已写入 scripts/kernel.sha256。请人工核对后提交该文件，后续运行才有保护。"
          fi
          tar -xzf /tmp/sb.tar.gz -C /tmp
          find /tmp -type f -name sing-box -not -name '*.tar.gz' -exec mv {} runtime/sing-box \;
          chmod +x runtime/sing-box
          runtime/sing-box version | head -1

      # 脚本按 <仓库根>/runtime/sing-box 自行定位内核，不需要传环境变量
      - name: Run prober and classifier
        run: python scripts/main_v2.py
        env:
          PYTHONUNBUFFERED: '1'

      # v4.6.2 —— 只在失败时上传，用来对照日志定位问题
      - name: Upload output on failure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: run-output
          path: output/
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit and push results
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A output/ README.md
          # 首轮生成的内核哈希基线也要提交，否则每轮都被当作「首次」，校验永远不生效
          git add scripts/kernel.sha256 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "无变更，跳过提交。"
          else
            git commit -m "Auto Update: $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
            git push
          fi

      # 必须在 push 之后刷新，否则 jsDelivr 会重抓旧内容并缓存
      - name: Purge jsDelivr CDN
        if: success()
        run: |
          REPO="${GITHUB_REPOSITORY}"
          p() { curl -s -o /dev/null "https://purge.jsdelivr.net/gh/${REPO}@main/$1" || true; }
          p README.md
          for f in v2ray.txt clash.yaml singbox.json \
                   residential.txt residential-clash.yaml residential-singbox.json; do
            p "output/$f"
          done
          find output/residential-by-country output/by-country -type f 2>/dev/null \
            | while read -r f; do p "$f"; sleep 0.2; done
          echo "CDN purge 完成"
